<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Territory">
<meta name="theme-color" content="#0D6B4F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<title>Territory Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* ═══ DESIGN TOKENS ═══════════════════════════════════════════════════ */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E8EBF0;
  --text:#0F1729; --text-2:#5A6478; --text-3:#8A93A6;
  --border:#E2E6EC; --border-strong:#CDD4DF;
  --brand:#0D6B4F; --brand-soft:#E6F4EE; --brand-ink:#FFFFFF;
  --rv:#6941C6; --rv-soft:#F0EAFB;
  /* Apartment units. Indigo: distinct from the visit-status colours (green,
     amber, red, grey) and from return-visit violet, so a unit number never
     reads as a status. */
  /* Apartment building number. Blue, distinct from every status colour. */
  --unit:#1565C0; --unit-soft:#E3F0FC;
  /* Street headings. */
  --street:#C0392B;
  --ok:#12805C; --ok-soft:#E4F5EE;
  --warn:#B54708; --warn-soft:#FDF0E6;
  --bad:#B42318; --bad-soft:#FDECEA;
  --none:#6B7488; --none-soft:#EDEFF3;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-2:0 4px 12px rgba(16,24,40,.10);
  --shadow-3:0 -8px 32px rgba(16,24,40,.16);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:999px;
  --sheet-ease:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tabbar-h:58px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1117; --surface:#161B22; --surface-2:#1C232C; --surface-3:#262D38;
    --text:#E8EDF4; --text-2:#9BA5B4; --text-3:#6E7889;
    --border:#293039; --border-strong:#3A424E;
    --brand:#3FB68B; --brand-soft:#12301F; --brand-ink:#05150E;
    --rv:#A98BFF; --rv-soft:#241B3A;
    --unit:#6BB6FF; --unit-soft:#12283C;
    --street:#FF8577;
    --ok:#3FB68B; --ok-soft:#12301F;
    --warn:#E8944A; --warn-soft:#33210F;
    --bad:#F27267; --bad-soft:#331815;
    --none:#8A93A6; --none-soft:#22272F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 4px 14px rgba(0,0,0,.5);
    --shadow-3:0 -8px 32px rgba(0,0,0,.6);
  }
}

/* ═══ BASE ════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior-y:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  font-size:16px; line-height:1.45;
}
button,input,textarea,select{font:inherit;color:inherit;font-family:inherit;}
button{background:none;border:none;cursor:pointer;touch-action:manipulation;}
input,textarea,select{-webkit-appearance:none;appearance:none;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ═══ APP FRAME ═══════════════════════════════════════════════════════ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

#topbar{
  flex:0 0 auto;padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.scope-btn{
  display:flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;
  background:var(--surface-2);border-radius:var(--r-full);
  font-size:15px;font-weight:650;letter-spacing:-.01em;max-width:58vw;
}
.scope-btn .scope-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scope-btn .count{
  font-size:12px;font-weight:700;color:var(--text-2);
  background:var(--surface);padding:1px 7px;border-radius:var(--r-full);flex:0 0 auto;
}
.scope-btn .chev{color:var(--text-3);font-size:11px;flex:0 0 auto;}
.top-spacer{flex:1;}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r-full);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;
}
.icon-btn:active{background:var(--surface-3);}

/* sync pill */
#syncPill{
  display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;
  border-radius:var(--r-full);background:var(--surface-2);
  font-size:13px;font-weight:650;flex:0 0 auto;
}
#syncPill .sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto;}
#syncPill.pending{background:var(--warn-soft);color:var(--warn);}
#syncPill.pending .sdot{background:var(--warn);}
#syncPill.offline{background:var(--none-soft);color:var(--text-2);}
#syncPill.offline .sdot{background:var(--none);}
#syncPill.syncing .sdot{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ═══ VIEWS ═══════════════════════════════════════════════════════════ */
#views{flex:1;position:relative;min-height:0;}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0;}
.view.active{display:flex;}
/* The map must stay mounted or Leaflet re-inits and loses tiles/pins. */
#view-map{display:flex;visibility:hidden;pointer-events:none;}
#view-map.active{visibility:visible;pointer-events:auto;}
.scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
/* clearance so the FAB never sits on top of the last row's Log button */
#houseList{padding-bottom:88px;}

/* search + filters */
.toolbar{flex:0 0 auto;padding:10px 12px 8px;background:var(--surface);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;display:flex;align-items:center;}
.search-wrap .mag{position:absolute;left:12px;font-size:15px;color:var(--text-3);pointer-events:none;}
#searchBox{
  width:100%;height:42px;padding:0 38px 0 36px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-2);font-size:15px;
}
#searchBox:focus{border-color:var(--brand);background:var(--surface);outline:none;}
#searchClear{position:absolute;right:6px;width:32px;height:32px;border-radius:var(--r-full);
  display:none;align-items:center;justify-content:center;color:var(--text-3);font-size:15px;}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;height:38px;padding:0 13px;
  border-radius:var(--r-full);background:var(--surface-2);border:1px solid transparent;
  font-size:13px;font-weight:650;color:var(--text-2);white-space:nowrap;
}
.chip .cdot{width:7px;height:7px;border-radius:50%;}
.chip .cnum{font-size:11px;font-weight:700;opacity:.75;}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--border-strong);color:var(--text);box-shadow:var(--shadow-1);}
.chip[data-f="all"] .cdot{background:var(--text-3);}
.chip[data-f="never"] .cdot{background:var(--none);}
.chip[data-f="overdue"] .cdot{background:var(--bad);}
.chip[data-f="due"] .cdot{background:var(--warn);}
.chip[data-f="recent"] .cdot{background:var(--ok);}

/* ═══ HOUSE LIST ══════════════════════════════════════════════════════ */
.street-hd{
  position:sticky;top:0;z-index:2;padding:11px 16px 9px;
  background:var(--bg);color:var(--street);
  font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2;
  border-bottom:1px solid var(--border);
}
.street-hd .st-count{font-size:13px;font-weight:700;color:var(--text-3);letter-spacing:0;}

/* Apartment building header — the symbol makes a multi-unit address readable
   at a glance instead of looking like a stray house number. */
.apt-hd{
  display:flex;align-items:center;gap:7px;padding:11px 16px 5px;
  font-size:16px;font-weight:800;color:var(--unit);letter-spacing:-.01em;
}
.apt-hd .apt-ico{width:22px;height:22px;flex:0 0 auto;display:block;color:var(--unit);}
.apt-hd .apt-n{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;}
.house{
  display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;min-height:62px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.house:active{background:var(--surface-2);}
/* Unit rows sit under their building header, marked by a coloured rail so the
   group reads as one address rather than a run of separate houses. */
/* Units sit under their building header: a small indent and italics mark them
   as part of that building, without competing with the house numbers. */
.house.unit{padding-left:30px;border-left:3px solid var(--unit-soft);}
.house.unit .house-num{font-style:italic;}
.house-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;}
.house-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.dot-recent{background:var(--ok);} .dot-due{background:var(--warn);}
.dot-overdue{background:var(--bad);} .dot-never{background:var(--none);}
.house-txt{min-width:0;flex:1;}
.house-num{display:block;font-size:19px;font-weight:750;letter-spacing:-.02em;line-height:1.15;}
.house-num .warn-mark{color:var(--bad);font-size:12px;vertical-align:super;margin-left:2px;}
.house-sub{display:block;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.house-sub .rv-tag{color:var(--rv);font-weight:700;}
.house-sub .pend{color:var(--warn);font-weight:700;}
/* the list row is one full-width target now; logging lives on the detail sheet */
.empty{padding:56px 24px;text-align:center;color:var(--text-3);font-size:15px;}
.empty .big{font-size:34px;display:block;margin-bottom:10px;}

/* ═══ RETURN VISITS ═══════════════════════════════════════════════════ */
.rv-card{
  display:block;width:100%;text-align:left;padding:13px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);
}
.rv-card:active{background:var(--surface-2);}
.rv-top{display:flex;align-items:center;gap:8px;}
.rv-badge{width:8px;height:8px;border-radius:50%;background:var(--rv);flex:0 0 auto;}
.rv-addr{font-size:16px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rv-when{font-size:12px;color:var(--text-2);font-weight:600;flex:0 0 auto;}
.rv-note{font-size:13.5px;color:var(--text-2);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rv-count{display:block;font-size:11.5px;color:var(--rv);font-weight:700;margin-top:6px;}

/* ═══ MORE ════════════════════════════════════════════════════════════ */
.sec{margin:16px 12px 0;}
.sec-t{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);padding:0 4px 7px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;
  border-bottom:1px solid var(--border);min-height:56px;}
.row:last-child{border-bottom:none;}
.row:active{background:var(--surface-2);}
.row-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
.row-txt{flex:1;min-width:0;display:block;}
.row-t{display:block;font-size:15px;font-weight:650;}
.row-s{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;}
.row-act{color:var(--text-3);font-size:13px;flex:0 0 auto;}
.sw{width:50px;height:30px;border-radius:var(--r-full);background:var(--border-strong);
  position:relative;transition:background .2s;flex:0 0 auto;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);transition:transform .2s var(--sheet-ease);}
.sw[aria-checked="true"]{background:var(--brand);}
.sw[aria-checked="true"]::after{transform:translateX(20px);}

/* ═══ MAP ═════════════════════════════════════════════════════════════ */
#map{flex:1;background:var(--surface-2);}
.map-fabs{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:400;}

/* ── team ── */
.who{width:34px;height:34px;border-radius:var(--r-full);background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto;}
.who.sm{width:26px;height:26px;font-size:11px;}
.who.gray{background:var(--surface-3);color:var(--text-2);}
.mate-pin{display:flex;flex-direction:column;align-items:center;}
.mate-pin .mp-dot{width:26px;height:26px;border-radius:50%;background:#7C3AED;color:#fff;border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.45);}
.mate-pin .mp-name{margin-top:3px;background:rgba(20,20,28,.86);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 6px;border-radius:var(--r-full);white-space:nowrap;}

/* push to talk */
#pttWrap{position:absolute;left:0;right:0;bottom:14px;z-index:410;display:none;
  flex-direction:column;align-items:center;gap:7px;pointer-events:none;}
#pttWrap.on{display:flex;}
#pttHint{background:rgba(20,20,28,.86);color:#fff;font-size:12px;font-weight:650;
  padding:5px 12px;border-radius:var(--r-full);pointer-events:none;}
#ptt{
  width:76px;height:76px;border-radius:var(--r-full);pointer-events:auto;
  background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10px;font-weight:800;letter-spacing:.03em;touch-action:none;user-select:none;
  -webkit-user-select:none;transition:transform .12s,background .12s;
}
#ptt .pi{font-size:24px;line-height:1;}
#ptt.rec{background:var(--bad);color:#fff;transform:scale(1.12);}
#ptt[disabled]{opacity:.5;}

.user-row{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;text-align:left;
  border-bottom:1px solid var(--border);min-height:58px;}
.user-row:last-child{border-bottom:none;}
.user-row:active{background:var(--surface-2);}
.ur-t{font-size:15px;font-weight:700;display:block;}
.ur-s{font-size:12.5px;color:var(--text-2);display:block;margin-top:1px;}
.pill-tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:var(--r-full);
  background:var(--surface-3);color:var(--text-2);letter-spacing:.03em;text-transform:uppercase;}
.pill-tag.admin{background:var(--brand-soft);color:var(--brand);}
.pill-tag.pend{background:var(--warn-soft);color:var(--warn);}
.pill-tag.off{background:var(--bad-soft);color:var(--bad);}
.code-box{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:800;
  letter-spacing:.16em;text-align:center;padding:16px;border-radius:var(--r-md);
  background:var(--brand-soft);color:var(--brand);margin:10px 0;}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:var(--r-md);margin-bottom:14px;}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--text-2);}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);}
.map-fab{width:46px;height:46px;border-radius:var(--r-full);background:var(--surface);
  box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;font-size:19px;}
.map-fab:active{background:var(--surface-2);}
.leaflet-container{background:var(--surface-2);}
.pin-pop{font-family:inherit;min-width:170px;}
.pin-pop .pp-a{font-size:15px;font-weight:750;margin-bottom:2px;}
.pin-pop .pp-s{font-size:12px;color:#5A6478;margin-bottom:8px;}
.pin-pop .pp-row{display:flex;gap:6px;}
.pin-pop button{flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:700;}
.pin-pop .pp-det{background:#EEF1F5;color:#0F1729;}
.pin-pop .pp-log{background:#0D6B4F;color:#fff;}

/* ═══ FAB ═════════════════════════════════════════════════════════════ */
#fab{
  position:absolute;right:14px;bottom:16px;z-index:60;
  height:52px;padding:0 20px;border-radius:var(--r-full);
  background:var(--brand);color:var(--brand-ink);font-size:15px;font-weight:750;
  box-shadow:var(--shadow-2);display:flex;align-items:center;gap:7px;
}
#fab:active{filter:brightness(.92);transform:scale(.97);}

/* ═══ TAB BAR ═════════════════════════════════════════════════════════ */
#tabbar{
  flex:0 0 auto;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;height:var(--tabbar-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--text-3);position:relative;
}
.tab .ti{font-size:20px;line-height:1;}
.tab .tl{font-size:10.5px;font-weight:700;letter-spacing:.01em;}
.tab[aria-selected="true"]{color:var(--brand);}
.tab .tbadge{
  position:absolute;top:5px;left:50%;margin-left:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--r-full);background:var(--bad);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
}

/* ═══ SHEETS ══════════════════════════════════════════════════════════ */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(8,12,20,.45);
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--shadow-3);
  transform:translateY(101%);transition:transform .34s var(--sheet-ease);
  display:flex;flex-direction:column;max-height:92dvh;
  padding-bottom:var(--safe-b);
}
.sheet.open{transform:translateY(0);}
.sheet.dragging{transition:none;}
.grab{flex:0 0 auto;padding:9px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none;}
.grab::after{content:"";width:38px;height:4px;border-radius:2px;background:var(--border-strong);}
.sheet-hd{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;
  padding:4px 16px 12px;border-bottom:1px solid var(--border);
}
.sheet-hd .st{flex:1;min-width:0;}
.sheet-t{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-s{font-size:13px;color:var(--text-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.x-btn{position:relative;width:36px;height:36px;border-radius:var(--r-full);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-2);flex:0 0 auto;}
/* Keep the button visually small but give it a 44px tap area. */
.x-btn::after{content:"";position:absolute;top:-4px;right:-4px;bottom:-4px;left:-4px;}
.sheet-bd{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;}
.sheet-ft{flex:0 0 auto;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--border);
  background:var(--surface);display:flex;gap:9px;}

/* ═══ OUTCOME GRID (log visit) ════════════════════════════════════════ */
.out-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.out{
  min-height:82px;border-radius:var(--r-md);border:1.5px solid var(--border);
  background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;padding:8px 4px;
}
.out .oi{font-size:22px;line-height:1;}
.out .ol{font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;color:var(--text-2);}
.out:active{transform:scale(.96);}
.out[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);}
.out[aria-pressed="true"] .ol{color:var(--brand);}
.out[data-rv="1"][aria-pressed="true"]{border-color:var(--rv);background:var(--rv-soft);}
.out[data-rv="1"][aria-pressed="true"] .ol{color:var(--rv);}

/* ═══ FORM ════════════════════════════════════════════════════════════ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.f{margin-bottom:13px;}
.f label{display:block;font-size:11.5px;font-weight:750;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-3);margin-bottom:5px;}
.f input,.f textarea,.f select{
  width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-2);font-size:16px;
}
.f textarea{min-height:88px;resize:vertical;line-height:1.45;}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--brand);background:var(--surface);outline:none;}
.f select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27 viewBox=%270 0 12 8%27><path d=%27M1 1l5 5 5-5%27 stroke=%27%238A93A6%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;
}
.gps-row{display:flex;gap:8px;}
.gps-row input{flex:1;}
.gps-btn{width:46px;border-radius:var(--r-md);background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
.gps-btn.busy{animation:pulse 1s infinite;}
.btn{
  flex:1;min-height:50px;border-radius:var(--r-md);font-size:16px;font-weight:750;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-p{background:var(--brand);color:var(--brand-ink);}
.btn-p:active{filter:brightness(.92);}
.btn-s{background:var(--surface-2);color:var(--text);}
.btn-d{background:var(--bad-soft);color:var(--bad);}
.btn[disabled]{opacity:.5;}

/* detail sheet bits */
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border-radius:var(--r-full);font-size:12.5px;font-weight:700;}
.b-recent{background:var(--ok-soft);color:var(--ok);}
.b-due{background:var(--warn-soft);color:var(--warn);}
.b-overdue{background:var(--bad-soft);color:var(--bad);}
.b-never{background:var(--none-soft);color:var(--text-2);}
.b-rv{background:var(--rv-soft);color:var(--rv);}
.meta{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
.meta .mi{width:26px;text-align:center;flex:0 0 auto;opacity:.8;}
.lbl{font-size:11.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-3);margin:18px 0 7px;}
.note-box{background:var(--surface-2);border-radius:var(--r-md);padding:12px 13px;
  font-size:14.5px;white-space:pre-wrap;word-break:break-word;line-height:1.5;}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.vbox{min-height:62px;border-radius:var(--r-sm);border:1px dashed var(--border-strong);
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:8px 6px;overflow:hidden;}
.vbox .vn{font-size:9.5px;font-weight:750;color:var(--text-3);letter-spacing:.04em;flex:0 0 auto;}
/* Real notes run long. Clamp to keep the grid even; tapping opens the full text. */
.vbox .vv{font-size:12.5px;font-weight:700;text-align:center;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;overflow-wrap:anywhere;}
.vbox.filled{border-style:solid;border-color:var(--brand);background:var(--brand-soft);}
.vbox.filled .vv{color:var(--brand);}

/* return-visit timeline */
.rv-add{display:flex;gap:8px;margin-bottom:14px;}
.rv-add textarea{flex:1;min-height:76px;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--rv);border:2px solid var(--surface);}
.tl-d{font-size:11.5px;font-weight:750;color:var(--rv);letter-spacing:.03em;}
.tl-n{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-top:3px;line-height:1.5;}
.tl-del{font-size:11.5px;color:var(--text-3);font-weight:650;margin-top:4px;}

/* ═══ TOAST / BANNER ══════════════════════════════════════════════════ */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);z-index:300;
  max-width:calc(100vw - 32px);padding:11px 18px;border-radius:var(--r-full);
  background:var(--text);color:var(--bg);font-size:14px;font-weight:650;
  box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.bad{background:var(--bad);color:#fff;}
/* Top banner, not bottom. At the bottom it sat over the FAB and tab bar, so a
   tap meant for "+ Add" reloaded the app. z-index is below sheets (101) so it
   can never cover an open sheet either. */
#updateBar{
  position:fixed;left:10px;right:10px;top:calc(var(--safe-t) + 10px);
  z-index:95;display:none;align-items:center;gap:10px;padding:11px 14px;
  border-radius:var(--r-md);background:var(--brand);color:var(--brand-ink);
  box-shadow:var(--shadow-2);font-size:14px;font-weight:650;
}
#updateBar.show{display:flex;}
#updateBar button{margin-left:auto;background:rgba(255,255,255,.2);color:inherit;
  padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:750;flex:0 0 auto;}

/* skeleton */
.skel{padding:0;}
.skel-row{height:62px;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;padding:0 14px;gap:10px;}
.skel-bar{height:12px;border-radius:6px;background:var(--surface-3);animation:sh 1.3s ease-in-out infinite;}
@keyframes sh{0%,100%{opacity:.55}50%{opacity:1}}

@media (min-width:700px){
  #app{max-width:560px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.10);}
  .sheet{max-width:560px;left:50%;transform:translateX(-50%) translateY(101%);}
  .sheet.open{transform:translateX(-50%) translateY(0);}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>

<script>
(function(){
"use strict";

/* ═══ CONFIG ═══ */
var API="https://territory-manager-silk.vercel.app/api/territory";
var APP_VERSION="2.2.1";

/* ═══════════════════════════════════════════════════════════════════════
   OFFLINE DATA LAYER

   Two IndexedDB stores, and the app never reads the network directly:

     mirror  — the last snapshot we received from the server, untouched.
     pending — per-record *intentions*: only the fields this device changed,
               plus create/delete flags.

   What the UI shows is mirror + pending applied on top. Because pending
   records only the FIELDS you edited, a sync sends only those fields, and
   the server merges them into whatever the live row holds. Two people
   editing different fields of the same house therefore never clobber each
   other — which matters here, because a lost note means a real person is
   forgotten.

   Every write lands in IndexedDB before the UI acknowledges it. Sync is
   always a background concern; the app is fully usable with the radio off.
   ═══════════════════════════════════════════════════════════════════════ */

var DB_NAME = 'territory-manager', DB_VER = 1;
var S_MIRROR = 'mirror', S_PENDING = 'pending', S_META = 'meta';
var _db = null;

var _dbPromise = null;

function dbOpen() {
  if (_db) return Promise.resolve(_db);
  // Cache the promise, not just the result: two callers racing at boot would
  // otherwise each open their own connection and leak one forever.
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function (resolve, reject) {
    if (!self.indexedDB) { reject(new Error('IndexedDB is unavailable (private browsing?)')); return; }
    var req;
    try { req = indexedDB.open(DB_NAME, DB_VER); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(S_MIRROR)) db.createObjectStore(S_MIRROR, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(S_PENDING)) db.createObjectStore(S_PENDING, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(S_META)) db.createObjectStore(S_META, { keyPath: 'k' });
    };
    req.onsuccess = function () {
      _db = req.result;
      // Another tab upgrading must not leave this connection wedged.
      _db.onversionchange = function () { try { _db.close(); } catch (e) {} _db = null; _dbPromise = null; };
      resolve(_db);
    };
    req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
    req.onblocked = function () { reject(new Error('IndexedDB blocked by another tab')); };
  });
  _dbPromise.catch(function () { _dbPromise = null; }); // let a later attempt retry
  return _dbPromise;
}

function tx(store, mode, fn) {
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t, s, out, reqErr = null;
      try { t = db.transaction(store, mode); s = t.objectStore(store); out = fn(s); }
      catch (e) { reject(e); return; }
      // A failing *request* surfaces its error on the request, not the
      // transaction — t.error is null there. Rejecting with null made every
      // catch block throw on e.message, so real failures vanished.
      if (out && typeof out === 'object' && 'onerror' in out) {
        out.onerror = function (ev) { reqErr = out.error; if (ev && ev.stopPropagation) ev.stopPropagation(); };
      }
      t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
      t.onerror = function () { reject(t.error || reqErr || new Error('IndexedDB transaction failed')); };
      t.onabort = function () { reject(t.error || reqErr || new Error('IndexedDB transaction aborted')); };
    });
  });
}

var idb = {
  all: function (store) {
    return tx(store, 'readonly', function (s) { return s.getAll(); })
      .then(function (r) { return r || []; });
  },
  put: function (store, val) { return tx(store, 'readwrite', function (s) { return s.put(val); }); },
  del: function (store, key) { return tx(store, 'readwrite', function (s) { return s.delete(key); }); },
  clear: function (store) { return tx(store, 'readwrite', function (s) { return s.clear(); }); },
  putAll: function (store, vals) {
    return tx(store, 'readwrite', function (s) { vals.forEach(function (v) { s.put(v); }); });
  },
  replaceAll: function (store, vals) {
    return tx(store, 'readwrite', function (s) { s.clear(); vals.forEach(function (v) { s.put(v); }); });
  },
  getMeta: function (k) {
    return tx(S_META, 'readonly', function (s) { return s.get(k); })
      .then(function (r) { return r ? r.v : null; });
  },
  setMeta: function (k, v) { return idb.put(S_META, { k: k, v: v }); },
};

/* ── in-memory working set ───────────────────────────────────────────── */
var mirror = {};   // id -> server record
var pending = {};  // id -> {id, fields:{}, created, deleted, at}

function localId() {
  return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* The merged view the UI renders from. */
function buildRecords() {
  var out = [];
  Object.keys(mirror).forEach(function (id) {
    var p = pending[id];
    if (p && p.deleted) return;
    out.push(p ? Object.assign({}, mirror[id], p.fields) : mirror[id]);
  });
  Object.keys(pending).forEach(function (id) {
    var p = pending[id];
    if (!p.created || p.deleted || mirror[id]) return;
    out.push(Object.assign({ id: id }, p.fields));
  });
  return out;
}

function pendingCount() {
  return Object.keys(pending).filter(function (id) {
    var p = pending[id];
    return p.deleted || p.created || Object.keys(p.fields).length;
  }).length;
}

/* ── local mutations ─────────────────────────────────────────────────── */

/* Record a field-level edit. Returns once it is durably in IndexedDB. */
function localUpdate(id, changes) {
  var p = pending[id] || (pending[id] = { id: id, fields: {}, created: false, deleted: false, at: 0 });
  Object.keys(changes).forEach(function (k) { p.fields[k] = changes[k]; });
  p.at = Date.now();
  return idb.put(S_PENDING, p);
}

function localCreate(rec) {
  var id = rec.id || localId();
  var fields = {};
  Object.keys(rec).forEach(function (k) { if (k !== 'id') fields[k] = rec[k]; });
  pending[id] = { id: id, fields: fields, created: true, deleted: false, at: Date.now() };
  return idb.put(S_PENDING, pending[id]).then(function () { return id; });
}

function localDelete(id) {
  var p = pending[id];
  // Created offline and never sent: the server has never heard of it, so drop
  // it outright. But NOT while its create is mid-flight — the response would
  // land afterwards, put it in the mirror, and resurrect it with no pending
  // delete to remove it again.
  if (p && p.created && !mirror[id] && !inFlightIds[id]) {
    delete pending[id];
    return idb.del(S_PENDING, id);
  }
  pending[id] = { id: id, fields: (p && p.fields) || {}, created: false, deleted: true, at: Date.now() };
  return idb.put(S_PENDING, pending[id]);
}

/* ── sync ────────────────────────────────────────────────────────────── */
var syncing = false;
var lastSyncError = null;
var inFlightIds = {}; // ids whose create/update is currently being sent

function loadLocal() {
  return Promise.all([idb.all(S_MIRROR), idb.all(S_PENDING)]).then(function (r) {
    mirror = {};
    r[0].forEach(function (rec) { mirror[rec.id] = rec; });
    pending = {};
    r[1].forEach(function (p) { pending[p.id] = p; });
  });
}

/* Push local intentions, pull the authoritative snapshot back.
   Returns {ok, offline?, conflicts?, error?}. Never throws. */
function sync(opts) {
  opts = opts || {};
  if (syncing) return Promise.resolve({ ok: false, busy: true });
  syncing = true;

  // Snapshot exactly what we are sending, so edits made *during* the request
  // are not mistaken for synced and dropped.
  var sent = { creates: [], updates: [], deletes: [], snapshot: {} };
  inFlightIds = {};
  Object.keys(pending).forEach(function (id) {
    var p = pending[id];
    inFlightIds[id] = true;
    sent.snapshot[id] = JSON.parse(JSON.stringify(p));
    if (p.deleted) { sent.deletes.push(id); return; }
    if (p.created) { sent.creates.push(Object.assign({ id: id }, p.fields)); return; }
    if (Object.keys(p.fields).length) {
      var u = Object.assign({ id: id }, p.fields);
      var base = mirror[id] && mirror[id].HouseUpdatedAt;
      if (base) u._base = base;
      sent.updates.push(u);
    }
  });

  var nothingToPush = !sent.creates.length && !sent.updates.length && !sent.deletes.length;
  var authHeaders = authToken ? { Authorization: 'Bearer ' + authToken } : {};
  var on401 = function (r) {
    // Signed out or expired. Flag it, but never touch what is already on the
    // device: the queue must survive to be uploaded after signing back in.
    if (r.status === 401 || r.status === 403) {
      var e = new Error('AUTH');
      e.needsAuth = true;
      throw e;
    }
  };
  var request = nothingToPush && !opts.force
    ? fetch(API, { method: 'GET', headers: authHeaders }).then(function (r) {
        on401(r);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (records) { return { records: records, conflicts: [] }; })
    : fetch(API, {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders),
        body: JSON.stringify({ creates: sent.creates, updates: sent.updates, deletes: sent.deletes }),
      }).then(function (r) {
        on401(r);
        if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 200)); });
        return r.json();
      });

  return request.then(function (res) {
    // Replace the mirror wholesale — the server just told us the truth.
    mirror = {};
    (res.records || []).forEach(function (rec) { mirror[rec.id] = rec; });

    // Clear only what we actually sent AND that has not been re-edited since.
    var stillPending = {};
    Object.keys(pending).forEach(function (id) {
      var now = pending[id], was = sent.snapshot[id];
      if (!was) { stillPending[id] = now; return; } // edited during the request
      var keep = { id: id, fields: {}, created: false, deleted: false, at: now.at };
      var any = false;
      Object.keys(now.fields).forEach(function (k) {
        // Value changed again while in flight -> it was not covered by this sync.
        if (!(k in was.fields) || JSON.stringify(was.fields[k]) !== JSON.stringify(now.fields[k])) {
          keep.fields[k] = now.fields[k]; any = true;
        }
      });
      if (now.deleted && !was.deleted) { keep.deleted = true; any = true; }
      if (now.created && !was.created) { keep.created = true; any = true; }
      if (any) stillPending[id] = keep;
    });
    pending = stillPending;

    return Promise.all([
      idb.replaceAll(S_MIRROR, Object.keys(mirror).map(function (k) { return mirror[k]; })),
      idb.replaceAll(S_PENDING, Object.keys(pending).map(function (k) { return pending[k]; })),
      idb.setMeta('lastSync', new Date().toISOString()),
    ]).then(function () {
      lastSyncError = null;
      return { ok: true, conflicts: res.conflicts || [], pushed: sent.creates.length + sent.updates.length + sent.deletes.length };
    });
  }).catch(function (e) {
    // Offline, signed out, or a server error: pending is untouched and still on
    // disk either way. Nothing is ever lost here.
    lastSyncError = e.message;
    if (e.needsAuth) return { ok: false, needsAuth: true, error: 'Sign in to sync' };
    return { ok: false, offline: !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(e.message), error: e.message };
  }).then(function (r) { syncing = false; inFlightIds = {}; return r; });
}

/* ═══ HELPERS ═══ */
function $(s){return document.querySelector(s);}
function esc(v){if(v===0)return"0";if(!v)return"";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function cleanDate(v){if(!v)return"";return String(v).substring(0,10);}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
/* "2026-08-22" parses as UTC midnight, which renders as the 21st for anyone
   west of Greenwich. Visit dates are calendar days, not instants, so parse
   date-only strings in local time. */
function parseDay(v){
  if(!v)return null;
  var s=String(v).trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  var d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);
  return isNaN(d)?null:d;
}
function fmtDate(v){var d=parseDay(v);if(!d)return v?String(v):"Never";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function daysSince(v){var d=parseDay(v);if(!d)return Infinity;
  var t=new Date();t.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.round((t.getTime()-d.getTime())/86400000);}
function visitStatus(v){var d=daysSince(v);if(d===Infinity)return"never";
  if(d<=30)return"recent";if(d<=90)return"due";return"overdue";}
function visitLabel(v){if(!v)return"Never visited";var d=daysSince(v);
  if(d<=0)return"Visited today";if(d===1)return"Yesterday";if(d<365)return d+" days ago";
  return fmtDate(v);}
function fullAddr(r){return[r.HouseAddress,r.HouseCity,r.HouseState,r.HouseZIP].filter(Boolean).join(", ");}
function parseGPS(v){if(!v)return null;var p=String(v).split(",").map(function(s){return parseFloat(s.trim());});
  if(p.length===2&&!isNaN(p[0])&&!isNaN(p[1])&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180)return{lat:p[0],lng:p[1]};return null;}

function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms||8);}catch(e){}}

/* Visits and return visits live in append-only JSON logs that the server
   merges by entry id, so two phones working the same street offline can
   never overwrite each other's notes. Entries carry a stable `i`; deleting
   one writes a tombstone (x:1) rather than removing it, or the next sync
   from the other device would resurrect it.

   Bad JSON must never take the app down — treat it as empty and carry on. */
function entryId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function parseLog(s){
  if(!s)return[];
  try{var a=JSON.parse(s);return Array.isArray(a)?a:[];}catch(e){return[];}
}
function liveEntries(s){return parseLog(s).filter(function(e){return e&&!e.x;});}
function getRVs(h){return h?liveEntries(h.HouseReturnVisits):[];}
function getLog(h){return h?parseLog(h.HouseVisitLog):[];}
function isRV(h){return getRVs(h).length>0;}

/* Mirrors the server's projection so the five visit slots look right
   immediately, before any sync. */
function deriveSlotsLocal(changes,logArr){
  var live=logArr.filter(function(e){return e&&!e.x;})
    .sort(function(a,b){return String(a.d||"").localeCompare(String(b.d||""));});
  var last5=live.slice(-5);
  for(var n=1;n<=5;n++)changes["HouseResutsOnVisit"+n]=last5[n-1]?String(last5[n-1].t||""):"";
  if(live.length)changes.HouseLastVisitDate=live[live.length-1].d||changes.HouseLastVisitDate;
}

/* A record created before the visit log kept its history only in the slot
   columns. Seed the log from them once so the first append does not look
   like it erased them. */
/* Must match legacyId() in api/territory.js exactly, or the union merge would
   see two ids for the same visit and duplicate it on every sync. */
function legacyId(i,text){
  var s=String(text||""),h=0;
  for(var k=0;k<s.length;k++)h=(h*31+s.charCodeAt(k))|0;
  return "lg"+(i+1)+"-"+(h>>>0).toString(36);
}
function seedLogLocal(h){
  var log=parseLog(h.HouseVisitLog);
  if(log.length)return log;
  var seeded=[];
  for(var n=1;n<=5;n++){
    var v=h["HouseResutsOnVisit"+n];
    if(v)seeded.push({i:legacyId(n-1,v),d:h.HouseLastVisitDate||"",t:v});
  }
  return seeded;
}

/* ═══ PORTED VERBATIM: address helpers + PDF generator ═══ */

function extractStreet(addr){
  if(!addr)return"Unknown Street";
  var cleaned=addr.trim().replace(/\s+(APT|UNIT|STE|SUITE|#)\s*.*/i,"").replace(/^[\d,\s]+/,"").trim();
  return cleaned||addr;
}

function extractNumber(addr){
  if(!addr)return"";
  var clean=addr.trim().replace(/\s+(APT|UNIT|STE|SUITE|#)\s*.*/i,"");
  var m=clean.match(/^([\d,\s]+[A-Za-z]?)\s/);
  if(m){var n=m[1].replace(/\s+$/,"");return n;}
  return clean;
}

function extractBaseNum(addr){
  if(!addr)return"";
  var clean=addr.trim().replace(/\s+(APT|UNIT|STE|SUITE|#)\s*.*/i,"");
  var m=clean.match(/^(\d+)/);
  return m?m[1]:"";
}

function extractApt(addr){
  if(!addr)return"";
  var m=addr.match(/\s+(?:APT|UNIT|STE|SUITE|#)\s*(.*)/i);
  return m?m[1].trim():"";
}

function hasApt(addr){return!!extractApt(addr);}

function generateTerritoryPDF(terrNum,houses){

    doc.setFont("helvetica","bold");doc.setFontSize(10);
    doc.text("REGISTRO DE CASA EN CASA",ml,y);
    y+=6;
    doc.setFontSize(9);
    doc.setFont("helvetica","bold");
    doc.text(streetName||"",ml,y);
    doc.text("Terr. No:",ml+cw-28,y);
    doc.setFont("helvetica","underline");
    doc.text(terrNum,ml+cw-10,y);
    doc.setFont("helvetica","normal");
    y+=5;
    doc.setFont("helvetica","bold");doc.setFontSize(7);
    doc.text("Simbolos",ml,y);
    doc.setFont("helvetica","normal");
    y+=3.5;
    doc.text("V -- vuelva",ml,y);
    doc.text("O -- ocupado",ml+c3,y);
    doc.text("H -- hombre",ml+c3*2,y);

        checkPageBreak(aptHeaderH+calcRowH(g.items[0]));
        pageY=drawAptHeader(pageY,g.num);
        g.items.forEach(function(h){
          checkPageBreak(calcRowH(h));
          var apt=extractApt(h.HouseAddress);
          pageY=drawHouseRows(pageY,apt||g.num,true,h);
        });
      } else {
        g.items.forEach(function(h){
          checkPageBreak(calcRowH(h));
          pageY=drawHouseRows(pageY,extractNumber(h.HouseAddress),false,h);
        });
      }
    });

    pageY+=2;
  });

  totalPages=pageNum;
  doc.setFontSize(7);doc.setFont("helvetica","normal");
  var dateStr=new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  for(var p=1;p<=totalPages;p++){
    doc.setPage(p);
    doc.text(dateStr,ml,ph-10);
    doc.setTextColor(0);
    var pgText="Page "+p+" of "+totalPages;
    doc.text(pgText,ml+cw-doc.getTextWidth(pgText),ph-10);
  }

  var filename="Territory_"+(terrNum==="Unassigned"?"Unassigned":terrNum)+".pdf";
  doc.save(filename);
  toast("PDF exported ✓");
}

/* drag-to-dismiss on the grab handle */
document.querySelectorAll("[data-drag]").forEach(function(g){
  var sheet=g.closest(".sheet"),y0=0,dy=0,dragging=false;
  function down(e){dragging=true;dy=0;y0=(e.touches?e.touches[0]:e).clientY;sheet.classList.add("dragging");}
  function move(e){
    if(!dragging)return;
    dy=Math.max(0,(e.touches?e.touches[0]:e).clientY-y0);
    sheet.style.transform=(window.innerWidth>=700?"translateX(-50%) ":"")+"translateY("+dy+"px)";
  }
  function up(){
    if(!dragging)return;dragging=false;sheet.classList.remove("dragging");
    if(dy>110){sheet.style.transform="";closeSheet("#"+sheet.id);}
    else sheet.style.transform="";
  }
  g.addEventListener("touchstart",down,{passive:true});
  g.addEventListener("touchmove",move,{passive:true});
  g.addEventListener("touchend",up);
  g.addEventListener("mousedown",function(e){down(e);
    var mm=function(ev){move(ev);},mu=function(){up();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};
    document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);});
});

$("#lSave").addEventListener("click",function(){
  var h=byId(curId);if(!h)return;
  var note=$("#lNote").value.trim();
  if(!curOutcome&&!note){toast("Pick an outcome or write a note",true);return;}
  var text=curOutcome==="RV"?(note||"Return visit"):[curOutcome,note].filter(Boolean).join(" — ");

  var log=seedLogLocal(h);
  if(curSlot){
    // Editing one specific slot: replace the entry it projects from, so the
    // grid stays in step instead of growing a duplicate.
    var live=log.filter(function(e){return e&&!e.x;})
      .sort(function(a,b){return String(a.d||"").localeCompare(String(b.d||""));});
    var target=live.slice(-5)[curSlot-1];
    if(target)target.t=text;
    else log.push({i:entryId(),d:todayStr(),t:text});
  }else{
    log.push({i:entryId(),d:todayStr(),t:text});
  }

  var changes={HouseVisitLog:JSON.stringify(log),HouseLastVisitDate:todayStr()};
  deriveSlotsLocal(changes,log);

  if(curOutcome==="RV"){
    var rv=parseLog(h.HouseReturnVisits);
    rv.push({i:entryId(),d:todayStr(),n:note||"Started return visit"});
    changes.HouseReturnVisits=JSON.stringify(rv);
  }
  saveChanges(curId,changes,"Visit logged ✓");
  closeSheet("#sh-log");

function openRV(id){

  curId=id;

function drawRV(){
  var h=byId(curId);if(!h)return;
  var rv=getRVs(h).slice().sort(function(a,b){return String(b.d).localeCompare(String(a.d));});
  $("#rBody").innerHTML=
    '<div class="rv-add">'+
      '<textarea id="rvNew" placeholder="What did you talk about? Who did you speak with?"></textarea>'+
    '</div>'+
    '<button class="btn btn-p" id="rvAdd" style="width:100%">＋ Add return visit note</button>'+
    (rv.length?'<div class="lbl">History</div><div class="tl">'+rv.map(function(x){
      return '<div class="tl-item"><div class="tl-d">'+esc(fmtDate(x.d))+'</div>'+
        '<div class="tl-n">'+esc(x.n||"")+'</div>'+
        '<button class="tl-del" data-act="rvdel" data-eid="'+esc(x.i||"")+'">Delete</button></div>';
    }).join("")+'</div>'
    :'<div class="empty" style="padding:30px 10px"><span class="big">📖</span>No notes yet.</div>');
  ownDraft("rvNew",curId);

  /* Every mutation here must await the write before redrawing. Redrawing
     synchronously reads the pre-write `records` array, so the note the user
     just typed disappears — and a second tap would then build its payload
     from that stale array and destroy the first note for real. */
  var addBtn=$("#rvAdd");
  addBtn.addEventListener("click",function(){
    var box=$("#rvNew"), t=box.value.trim();
    if(!t){toast("Write a note first",true);return;}
    if(addBtn.disabled)return;
    addBtn.disabled=true;box.disabled=true;
    var cur=parseLog(byId(curId).HouseReturnVisits);
    cur.push({i:entryId(),d:todayStr(),n:t});
    saveChanges(curId,{HouseReturnVisits:JSON.stringify(cur),HouseLastVisitDate:todayStr()},"Return visit saved ✓")
      .then(function(ok){
        clearDraft();          // it is committed now; do not offer it back later
        if(ok)drawRV();
        else{addBtn.disabled=false;box.disabled=false;}
      });
  });
  $("#rBody").querySelectorAll('[data-act="rvdel"]').forEach(function(b){
    b.addEventListener("click",function(){
      var eid=b.dataset.eid;
      if(b.disabled)return;
      if(!confirm("Delete this return-visit note?\n\nThis cannot be undone."))return;
      b.disabled=true;
      // Tombstone rather than splice: a removed entry would be restored by the
      // next sync from another device that still has it.
      var stored=parseLog(byId(curId).HouseReturnVisits);
      var hit=false;
      stored.forEach(function(e){if(String(e.i)===eid){e.x=1;hit=true;}});
      if(!hit){b.disabled=false;return;}
      saveChanges(curId,{HouseReturnVisits:JSON.stringify(stored)},"Note deleted")
        .then(function(){drawRV();});
    });
  });
}

/* ═══ FORM ═══ */
/* Plain columns the form owns outright. The five visit slots are deliberately
   NOT here: the server derives them from HouseVisitLog and discards anything a
   client sends for them, so writing them directly would look saved and then be
   silently reverted by the next sync. They are translated into log edits in
   #fSave instead. */
var FORM=[["fAddr","HouseAddress"],["fCity","HouseCity"],["fState","HouseState"],["fZip","HouseZIP"],
  ["fTerr","HouseTerritoryNumber"],["fAssigned","HouseTerritoryAssingnedTo"],["fLang","HouseLanguage"],
  ["fGPS","HouseGPSCoordinates"],["fNotes","HouseNotes"],["fPersonal","HousePersonalNotes"]];
var FORM_SLOTS=["fV1","fV2","fV3","fV4","fV5"];
var formSlotsAtOpen=["","","","",""];   // what the form showed when it opened

function setVerified(val){
  var sel=$("#fVerified"),i;
  for(i=sel.options.length-1;i>=0;i--)if(sel.options[i].dataset.adhoc)sel.remove(i);
  var known=false;
  for(i=0;i<sel.options.length;i++)if(sel.options[i].value===val){known=true;break;}
  if(val&&!known){var o=new Option(val,val);o.dataset.adhoc="1";sel.add(o);}
  sel.value=val;
}
function openForm(h){
  $("#fTitle").textContent=h?"Edit house":"Add house";
  $("#fDelete").style.display=h?"flex":"none";
  $("#fId").value=h?h.id:"";
  FORM.forEach(function(p){$("#"+p[0]).value=h?(h[p[1]]||""):"";});
  // The slots are not in FORM (the server derives them), so fill them from the
  // record explicitly. Leaving them blank would make slotEditsToLog read every
  // visit as "cleared" on save and tombstone real history.
  FORM_SLOTS.forEach(function(fid,i){
    var v=h?(h["HouseResutsOnVisit"+(i+1)]||""):"";
    $("#"+fid).value=v;
    formSlotsAtOpen[i]=v;
  });
  $("#fLastVisit").value=h?cleanDate(h.HouseLastVisitDate):"";
  setVerified(h?(h.HouseVerifiedOnMaps||""):"");
  if(!h){
    $("#fState").value="CA";
    // Prefill from what they are already looking at — most houses come in batches.
    if(terrFilter!=="all")$("#fTerr").value=terrFilter;
    var sample=records[0];
    if(sample){$("#fCity").value=sample.HouseCity||"";$("#fZip").value=sample.HouseZIP||"";}
  }
  openSheet("#sh-form");
}

/* Translate the five visit inputs into edits on the append-only log, which is
   the actual source of truth. Editing an existing slot rewrites that entry's
   text; typing into an empty slot appends a new entry. */
function slotEditsToLog(h){
  var log=seedLogLocal(h);
  var live=log.filter(function(e){return e&&!e.x;})
    .sort(function(a,b){return String(a.d||"").localeCompare(String(b.d||""));});
  var shown=live.slice(-5);
  var touched=false;
  FORM_SLOTS.forEach(function(fid,i){
    var val=$("#"+fid).value.trim();
    // Compare against what the form actually DISPLAYED, not against the log.
    // If population ever fails, the opened value is blank too, so the field
    // reads as unchanged and no visit is destroyed. Comparing to the log would
    // read an unpopulated form as "the user cleared everything".
    var opened=String(formSlotsAtOpen[i]||"").trim();
    if(val===opened)return;
    var cur=shown[i];
    touched=true;
    if(cur){
      if(val)cur.t=val;
      else cur.x=1;                       // deliberately cleared -> tombstone
    }else if(val){
      log.push({i:entryId(),d:$("#fLastVisit").value||todayStr(),t:val});
    }
  });
  return touched?log:null;
}

/* ═══ WRITE PATH ═══
   Every edit lands in IndexedDB first and the UI updates immediately.
   The network is a background consequence, so a write can never fail
   in front of the user. */
/* Returns a promise that settles only after the write is durably in
   IndexedDB. Callers that redraw MUST await it, or they render from a
   `records` array that has not been rebuilt yet and the user watches their
   note vanish. */
function saveChanges(id,changes,msg){
  return localUpdate(id,changes).then(function(){
    afterLocalChange();
    if(msg)toast(msg);
    haptic();
    scheduleSync();
    return true;
  }).catch(function(e){
    toast("Could not save on this phone: "+(e&&e.message||e),true);
    console.error("local save failed",e);
    return false;
  });
}
function afterLocalChange(){
  records=buildRecords();
  renderHouses();renderRV();refreshMapPins();updateSyncUI();
  if(openSheets.indexOf("#sh-detail")!==-1&&curId&&byId(curId))openDetail(curId);
}

/* ═══ SYNC ═══ */
var syncTimer=null;
function scheduleSync(){
  if(offlineMode)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){doSync(false);},2000);
}
function doSync(manual){
  if(offlineMode&&!manual){updateSyncUI();return Promise.resolve();}
  updateSyncUI("syncing");
  return sync().then(function(r){
    // A sync was already in flight. Our changes were not necessarily included
    // in it, so ask again shortly rather than dropping this attempt.
    if(r.busy){clearTimeout(syncTimer);syncTimer=setTimeout(function(){doSync(manual);},1500);return;}
    if(r.ok){
      records=buildRecords();
      renderHouses();renderRV();refreshMapPins();buildTerrSub();
      if(r.conflicts&&r.conflicts.length){
        toast(r.conflicts.length+" house(s) also changed elsewhere — check notes");
      }else if(manual){
        toast(r.pushed?("Synced "+r.pushed+" change"+(r.pushed===1?"":"s")+" ✓"):"Up to date ✓");
      }
    }else if(r.needsAuth){
      needsAuth=true;renderHouses();
      if(manual)openAuth();
    }else if(manual){
      toast(r.offline?"You're offline — changes are saved on this phone":("Sync failed: "+r.error),true);
    }
    if(r.ok)needsAuth=false;
    updateSyncUI();
  });
}
function updateSyncUI(forceState){
  var pill=$("#syncPill"),txt=$("#syncTxt"),n=pendingCount();
  var state=forceState||(offlineMode?"offline":(n?"pending":(lastSyncError?"offline":"ok")));
  pill.className="";
  if(state==="syncing"){pill.className="syncing";txt.textContent="Syncing…";}
  else if(state==="offline"){pill.className="offline";txt.textContent=n?(n+" saved"):"Offline";}
  else if(state==="pending"){pill.className="pending";txt.textContent=n+" to sync";}
  else{txt.textContent="Synced";}

  $("#pendSub").textContent=n?(n+" house"+(n===1?"":"s")+" waiting to upload"):"Nothing waiting";
  idb.getMeta("lastSync").then(function(v){
    $("#syncSub").textContent=v?("Last synced "+new Date(v).toLocaleString()):"Never synced";
  });
}

/* Own position, live. watchPosition only runs while the Map tab is showing —
   a GPS watch left running in the background is the fastest way to flatten a
   phone battery mid-territory. */
var meWatch=null,meMarker=null,meAccuracy=null;
function startMeWatch(){
  if(meWatch!==null||!navigator.geolocation||!mapReady)return;
  meWatch=navigator.geolocation.watchPosition(function(p){
    var lat=p.coords.latitude,lng=p.coords.longitude,acc=p.coords.accuracy||0;
    if(!meMarker){
      meAccuracy=L.circle([lat,lng],{radius:acc,color:"#2563EB",weight:1,
        fillColor:"#2563EB",fillOpacity:.12,interactive:false}).addTo(map);
      meMarker=L.circleMarker([lat,lng],{radius:8,color:"#fff",weight:3,
        fillColor:"#2563EB",fillOpacity:1,interactive:false}).addTo(map);
      map.setView([lat,lng],Math.max(map.getZoom(),16));
    }else{
      meMarker.setLatLng([lat,lng]);
      meAccuracy.setLatLng([lat,lng]).setRadius(acc);
    }
  },function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopMeWatch(){
  if(meWatch===null)return;
  navigator.geolocation.clearWatch(meWatch);meWatch=null;
}

function fitPins(){
  if(!mapReady)return;
  var pts=[];
  (terrFilter==="all"?records:records.filter(function(h){return(h.HouseTerritoryNumber||"Unassigned")===terrFilter;}))
    .forEach(function(h){var g=parseGPS(h.HouseGPSCoordinates);if(g)pts.push([g.lat,g.lng]);});
  if(pts.length)map.fitBounds(pts,{padding:[50,50],maxZoom:17});
}

});

function registerSW(){
  if(!("serviceWorker" in navigator))return;
  // Captured before registering. A first-ever install also fires updatefound,
  // and a worker from a different scope can be controlling us; neither is an
  // update, so requiring a controller that predates this registration keeps
  // "A new version is ready" from greeting first-time visitors.
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(function(reg){
    if(reg.waiting&&hadController){window._waitingSW=reg.waiting;$("#updateBar").classList.add("show");}
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing;if(!nw)return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed"&&hadController&&reg.active){
          window._waitingSW=nw;$("#updateBar").classList.add("show");
        }
      });
    });
  }).catch(function(){});
}


/* ═══════════════════════════════════════════════════════════════════════
   TEAM — accounts, territory assignment, live positions, push-to-talk.

   Everything here is additive: the house list, map and notes all work
   signed out exactly as before. Signing in only adds the shared parts.
   ═══════════════════════════════════════════════════════════════════════ */

var TEAM_API=API.replace(/\/territory$/,"/team");
var me=null, authToken="";
try{authToken=localStorage.getItem("tm_token")||"";}catch(e){}
var teamUsers=[], teamTerritories=[], teamHasUsers=true;

function initials(name){
  var p=String(name||"?").trim().split(/\s+/);
  return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();
}

function team(action,payload){
  return fetch(TEAM_API,{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},
      authToken?{Authorization:"Bearer "+authToken}:{}),
    body:JSON.stringify(Object.assign({action:action},payload||{}))
  }).then(function(r){
    return r.text().then(function(t){
      var j;try{j=JSON.parse(t);}catch(e){j={error:t.slice(0,200)};}
      if(!r.ok){
        // A dead session should sign you out cleanly, not fail silently forever.
        if(r.status===401&&authToken&&action!=="login"&&action!=="redeemSetup")signOut(true);
        var e2=new Error(j.error||("HTTP "+r.status));e2.status=r.status;throw e2;
      }
      return j;
    });
  });
}

function setSession(tok,user){
  authToken=tok||"";me=user||null;
  try{tok?localStorage.setItem("tm_token",tok):localStorage.removeItem("tm_token");}catch(e){}
  renderTeamCard();
}
function signOut(silent){
  stopPresence();stopVoicePoll();
  setSession("",null);
  // Wipe the local copy. Leaving it behind means the territory stays readable
  // to whoever next picks up the phone, which is the thing signing out is for.
  mirror={};pending={};needsAuth=true;records=[];
  Promise.all([idb.clear(S_MIRROR),idb.clear(S_PENDING)]).catch(function(){});
  renderHouses();renderRV();updateSyncUI();
  if(mapReady)refreshMapPins();
  if(!silent)toast("Signed out");
}

function refreshMe(){
  return team("status",{}).then(function(r){
    teamHasUsers=!!r.hasUsers;
    me=(r.me&&r.me.id)?r.me:null;
    if(!me)authToken="";
    renderTeamCard();
    return r;
  }).catch(function(){renderTeamCard();});
}

/* ── live positions ─────────────────────────────────────────────────────
   Posting and polling run only while the Map tab is open and a specific
   territory is selected. A background position feed is both a battery
   drain and a privacy problem. */
var presTimer=null, mateMarkers={};
function activeTerritory(){return terrFilter!=="all"?terrFilter:null;}

function startPresence(){
  if(presTimer||!me||!activeTerritory())return;
  var tick=function(){
    var terr=activeTerritory();if(!terr)return;
    if(meMarker){
      var ll=meMarker.getLatLng();
      team("postPresence",{territory:terr,lat:ll.lat,lng:ll.lng,acc:0}).catch(function(){});
    }
    team("getPresence",{territory:terr}).then(drawMates).catch(function(){});
  };
  tick();
  presTimer=setInterval(tick,15000);
}
function stopPresence(){
  if(presTimer){clearInterval(presTimer);presTimer=null;}
  Object.keys(mateMarkers).forEach(function(k){
    if(mapReady)map.removeLayer(mateMarkers[k]);
    delete mateMarkers[k];
  });
  if(me)team("clearPresence",{}).catch(function(){});
}
function drawMates(r){
  if(!mapReady)return;
  var seen={};
  (r.people||[]).forEach(function(p){
    seen[p.userId]=1;
    var icon=L.divIcon({className:"",iconSize:[26,40],iconAnchor:[13,13],
      html:'<div class="mate-pin"><div class="mp-dot">'+esc(initials(p.name))+'</div>'+
           '<div class="mp-name">'+esc(String(p.name).split(" ")[0])+'</div></div>'});
    if(mateMarkers[p.userId])mateMarkers[p.userId].setLatLng([p.lat,p.lng]).setIcon(icon);
    else mateMarkers[p.userId]=L.marker([p.lat,p.lng],{icon:icon,zIndexOffset:500}).addTo(map);
  });
  Object.keys(mateMarkers).forEach(function(k){
    if(!seen[k]){map.removeLayer(mateMarkers[k]);delete mateMarkers[k];}
  });
}

/* ── push to talk ───────────────────────────────────────────────────── */
var mediaRec=null, chunks=[], recStop=null, lastVoiceTs=0, voiceTimer=null;
var audioQueue=[], playing=false;

function pttSupported(){
  return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
}
function updatePttVisibility(){
  var w=$("#pttWrap");if(!w)return;
  var on=!!me&&!!activeTerritory()&&pttSupported();
  w.classList.toggle("on",on);
  if(on)startVoicePoll();else stopVoicePoll();
}
function pickMime(){
  var opts=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  for(var i=0;i<opts.length;i++)
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(opts[i]))return opts[i];
  return "";
}
function pttHint(t,resetMs){
  var h=$("#pttHint");if(!h)return;
  h.textContent=t;
  if(resetMs)setTimeout(function(){h.textContent="Hold to talk";},resetMs);
}

function startTalk(){
  if(mediaRec||!pttSupported()||!me||!activeTerritory())return;
  var btn=$("#ptt");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime=pickMime();
    try{mediaRec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:16000}:undefined);}
    catch(e){mediaRec=new MediaRecorder(stream);}
    chunks=[];
    var started=Date.now();
    mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    mediaRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(chunks,{type:mediaRec&&mediaRec.mimeType||mime||"audio/webm"});
      mediaRec=null;
      btn.classList.remove("rec");
      var secs=Math.round((Date.now()-started)/1000);
      if(secs<1||blob.size<800){pttHint("Hold to talk");return;}
      pttHint("Sending…");
      var fr=new FileReader();
      fr.onload=function(){
        var dataUrl=String(fr.result);
        if(dataUrl.length>44000){pttHint("Too long — keep it under 10s",2600);return;}
        team("postVoice",{territory:activeTerritory(),audio:dataUrl,dur:secs})
          .then(function(){pttHint("Sent ✓",1600);})
          .catch(function(e){pttHint(String(e.message).slice(0,44),2800);});
      };
      fr.readAsDataURL(blob);
    };
    mediaRec.start();
    btn.classList.add("rec");
    pttHint("Listening… release to send");
    haptic(15);
    // Hard stop: a stuck button must not record until the battery dies.
    recStop=setTimeout(stopTalk,10000);
  }).catch(function(){pttHint("Microphone blocked",2800);});
}
function stopTalk(){
  if(recStop){clearTimeout(recStop);recStop=null;}
  if(mediaRec&&mediaRec.state!=="inactive"){try{mediaRec.stop();}catch(e){mediaRec=null;}}
}

function startVoicePoll(){
  if(voiceTimer||!me)return;
  // Only clips from now on — nobody wants a backlog replayed at them.
  if(!lastVoiceTs)lastVoiceTs=Date.now();
  var tick=function(){
    var terr=activeTerritory();if(!terr)return;
    team("getVoice",{territory:terr,since:lastVoiceTs}).then(function(r){
      (r.clips||[]).forEach(function(c){
        if(c.ts>lastVoiceTs)lastVoiceTs=c.ts;
        audioQueue.push(c);
      });
      playNext();
    }).catch(function(){});
  };
  voiceTimer=setInterval(tick,8000);
  tick();
}
function stopVoicePoll(){
  if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null;}
  audioQueue=[];
}
function playNext(){
  if(playing||!audioQueue.length)return;
  var c=audioQueue.shift();
  playing=true;
  toast("\u{1F50A} "+String(c.name).split(" ")[0]);
  var a=new Audio(c.audio);
  a.onended=a.onerror=function(){playing=false;playNext();};
  var pr=a.play();
  if(pr&&pr.catch)pr.catch(function(){
    // Autoplay stays blocked until the page has been interacted with.
    playing=false;
    audioQueue.unshift(c);
    toast("Tap the screen to hear "+String(c.name).split(" ")[0],true);
  });
}

(function bindPtt(){
  var b=$("#ptt");if(!b)return;
  b.addEventListener("touchstart",function(e){e.preventDefault();startTalk();},{passive:false});
  b.addEventListener("touchend",function(e){e.preventDefault();stopTalk();});
  b.addEventListener("touchcancel",stopTalk);
  b.addEventListener("mousedown",startTalk);
  b.addEventListener("mouseup",stopTalk);
  b.addEventListener("mouseleave",stopTalk);
})();

    }).join("")+'</div>';

  loadLocal().then(function(){
    records=buildRecords();
    renderHouses();renderRV();buildTerrSub();updateSyncUI();
    restoreDrafts();
    // Ask to keep our data off the eviction list. Best-effort; ignore refusal.
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
    return doSync(false);
  }).catch(function(e){
    // IndexedDB can be unavailable outright (some private-browsing modes).
    // Fall back to read-only network data rather than leaving the user staring
    // at a loading skeleton forever.
    console.error("local store unavailable",e);
    storageBroken=true;
    fetch(API,{headers:authToken?{Authorization:"Bearer "+authToken}:{}}).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(list){
      mirror={};list.forEach(function(rec){mirror[rec.id]=rec;});
      records=buildRecords();
      renderHouses();renderRV();buildTerrSub();updateSyncUI();
      toast("Offline saving unavailable on this browser — changes need signal",true);
    }).catch(function(){
      $("#houseList").innerHTML='<div class="empty"><span class="big">⚠️</span>'+
        'Could not load your houses.<br><span style="font-size:13.5px">'+
        'This browser is blocking offline storage, and there is no signal right now.</span></div>';
    });
  });

  registerSW();
  refreshMe().then(loadTeam);
}

/* iOS kills backgrounded tabs without waiting for IndexedDB to flush, and a
   half-typed note lives only in the DOM. localStorage writes synchronously
   during pagehide, so mirror open composers there and offer them back. */
/* Each composer records which house it belongs to when it is OPENED. Reading
   curId at stash time instead would file a leftover note under whatever house
   the user happens to be looking at when the phone locks. */
var DRAFT_KEY="tm_drafts";
var draftOwner={};                    // composer element id -> house id
function ownDraft(el,id){draftOwner[el]=id;}
function clearDraft(){
  var box=document.getElementById("rvNew");
  if(box)box.value="";
  delete draftOwner.rvNew;
  writeDrafts(readDrafts().filter(function(d){return d.el!=="rvNew";}));
}
function readDrafts(){
  try{var a=JSON.parse(localStorage.getItem(DRAFT_KEY)||"[]");return Array.isArray(a)?a:[];}
  catch(e){return[];}
}
function writeDrafts(list){
  try{
    if(list.length)localStorage.setItem(DRAFT_KEY,JSON.stringify(list));
    else localStorage.removeItem(DRAFT_KEY);
  }catch(e){}
}
function stashDrafts(){
  var out=[];
  [["rvNew","return visit"],["lNote","visit note"]].forEach(function(p){
    var el=document.getElementById(p[0]);
    var owner=draftOwner[p[0]];
    // Only stash a composer that is actually open and owned. A stale value left
    // in a hidden sheet has already been saved or abandoned.
    if(!el||!owner||!el.value.trim())return;
    if(!isSheetOpen(p[0]==="rvNew"?"#sh-rv":"#sh-log"))return;
    out.push({el:p[0],id:owner,t:el.value,kind:p[1]});
  });
  writeDrafts(out);
}
function isSheetOpen(sel){var s=$(sel);return !!(s&&s.classList.contains("open"));}

function restoreDrafts(){
  var list=readDrafts().filter(function(d){return d&&d.id&&d.t&&byId(d.id);});
  if(!list.length){writeDrafts([]);return;}
  $("#pTitle").textContent=list.length>1?"Unsaved notes recovered":"Unsaved note recovered";
  $("#pSub").textContent=list.length>1?(list.length+" notes were still being typed"):"";
  $("#pBody").innerHTML=list.map(function(d,i){
    var h=byId(d.id);
    return '<div style="margin-bottom:16px">'+
      '<div class="lbl" style="margin-top:0">'+esc(h.HouseAddress||"")+' · '+esc(d.kind)+'</div>'+
      '<div class="note-box" style="margin-bottom:9px">'+esc(d.t)+'</div>'+
      '<div style="display:flex;gap:9px">'+
        '<button class="btn btn-s" data-dr="skip" data-i="'+i+'">Discard</button>'+
        '<button class="btn btn-p" data-dr="keep" data-i="'+i+'">Save as return visit</button>'+
      '</div></div>';
  }).join("");
  $("#pBody").querySelectorAll("[data-dr]").forEach(function(b){
    b.addEventListener("click",function(){
      var i=parseInt(b.dataset.i,10),d=list[i];
      if(!d)return;
      var done=function(){
        // Remove only this one; any other recovered note stays on offer.
        writeDrafts(readDrafts().filter(function(x){return !(x.el===d.el&&x.id===d.id&&x.t===d.t);}));
        list[i]=null;
        b.closest("div[style]").parentNode.removeChild(b.closest("div[style]"));
        if(!list.filter(Boolean).length)closeSheet("#sh-pick");
      };
      if(b.dataset.dr==="skip"){done();return;}
      var cur=parseLog(byId(d.id).HouseReturnVisits);
      cur.push({i:entryId(),d:todayStr(),n:d.t});
      saveChanges(d.id,{HouseReturnVisits:JSON.stringify(cur)},"Note recovered ✓").then(done);
    });
  });
  openSheet("#sh-pick");
}
window.addEventListener("pagehide",stashDrafts);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden")stashDrafts();
});

boot();
})();
</script>
</body>
